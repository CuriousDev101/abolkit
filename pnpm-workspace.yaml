packages:
  - 'packages/*'
  - 'services/*'
  - 'apps/*'

onlyBuiltDependencies:
  - esbuild
# Scalar's Vue entry has a postinstall we do not need: the API serves the
# prebuilt UMD bundle and does not import the Vue components.
allowBuilds:
  vue-demi: false
  # tsx (and other tools) need esbuild's postinstall binary
  esbuild: true
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1169.0'
  - '@aws-sdk/s3-request-presigner@3.1169.0'
