# Abol Kit backend: API + worker with Postgres, Redis and MinIO (ADR 0005, ADR 0007).
#
#   cp .env.example .env      # then set the secrets and provider keys
#   docker compose up -d --build
#
# API: http://localhost:8787 (docs at /docs). MinIO console: http://localhost:9001.
# Postgres, Redis and the MinIO API are published on 127.0.0.1 only, for local debugging.

name: abolkit

x-backend-env:
  &backend-env # URL captions path (ADR 0007): Postgres + Redis + MinIO. No SQLite in Compose.
  POSTGRES_URL: postgres://${POSTGRES_USER:-abolkit}:${POSTGRES_PASSWORD:-abolkit-dev-password}@postgres:5432/${POSTGRES_DB:-abolkit}
  REDIS_URL: redis://redis:6379
  STORAGE_PROVIDER: minio
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-abolkit}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-abolkit-dev-secret}
  MINIO_BUCKET: ${MINIO_BUCKET:-abolkit-media}
  MINIO_USE_SSL: 'false'
  CAPTION_ALLOWED_HOSTS: ${CAPTION_ALLOWED_HOSTS:-*}
  TRANSCRIBER: ${TRANSCRIBER:-assemblyai}
  TRANSCRIBER_OFF_HOST_CONSENT: ${TRANSCRIBER_OFF_HOST_CONSENT:-true}
  TRANSLATOR: ${TRANSLATOR:-gemini}
  TRANSLATOR_OFF_HOST_CONSENT: ${TRANSLATOR_OFF_HOST_CONSENT:-true}

x-backend: &backend
  build: .
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abolkit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abolkit-dev-password}
      POSTGRES_DB: ${POSTGRES_DB:-abolkit}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # BullMQ needs noeviction; cached captions expire through their TTL instead.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    ports:
      - 127.0.0.1:6379:6379
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Official MinIO images are no longer published; this is the community-maintained build.
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-abolkit}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-abolkit-dev-secret}
    volumes:
      - minio-data:/data
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *backend
    build:
      context: .
      target: api
    environment:
      <<: *backend-env
      HOST: 0.0.0.0
      PORT: '8787'
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8787}
    ports:
      - ${API_PORT:-8787}:8787

  worker:
    <<: *backend
    build:
      context: .
      target: worker
    environment:
      <<: *backend-env

volumes:
  postgres-data:
  redis-data:
  minio-data:
