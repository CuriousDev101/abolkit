<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abol Player demo</title>
    <style>
      body {
        margin: 0;
        font-family: 'Noto Sans', system-ui, sans-serif;
        background: #e8eee9;
        color: #122;
      }
      main {
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      abol-player {
        margin-block: 1rem 2.5rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Abol Kit player</h1>

      <h2>Attributes only</h2>
      <abol-player
        src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
        lang="en"
        captions="../../../samples/lesson-1/en.vtt"
        descriptions="../../../samples/lesson-1/ad.en.vtt"
        sign="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
        sign-placeholder
      >
        <track kind="captions" src="../../../samples/lesson-1/am.vtt" srclang="am" label="አማርኛ" />
      </abol-player>

      <h2>Generate captions from the API</h2>
      <p>
        Needs <code>docker compose up</code> and keys in <code>.env</code>. The player only calls
        the API when both attributes are set.
      </p>
      <abol-player
        src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
        lang="en"
        caption-api="http://localhost:8787"
        generate-captions="am om ti aa"
        sign="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
        sign-placeholder
      ></abol-player>

      <h2>From a lesson manifest</h2>
      <abol-player
        manifest="../../../samples/lesson-1/manifest.json"
        style="--abol-accent: #7a3cff"
      ></abol-player>
    </main>
    <script src="../dist/abol-player.js"></script>
  </body>
</html>
