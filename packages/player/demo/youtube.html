<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abol Player: YouTube</title>
    <style>
      body {
        margin: 0;
        font-family: 'Noto Sans', system-ui, sans-serif;
        background: #e8eee9;
        color: #122;
      }
      main {
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>YouTube source</h1>
      <p>
        Playback is the YouTube video. Captions and the transcript come from the caption API, not from sample
        files.
      </p>
      <abol-player
        src="https://youtu.be/5um9-i2Ta7w"
        lang="en"
        caption-api="http://localhost:8787"
        generate-captions="am om ti aa"
      ></abol-player>
    </main>
    <script src="../dist/abol-player.js"></script>
  </body>
</html>
